<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paytm GST Pulse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paytm-navy: #012e6e;
      --paytm-navy-deep: #001b4d;
      --paytm-blue: #00baf2;
      --paytm-blue-dark: #00a1d6;
      --bg: #eef3f9;
      --card: #ffffff;
      --line: #d7e3f0;
      --text: #1a2b45;
      --muted: #5b6f88;
      --ok: #00b259;
      --warn: #ff9f00;
      --hot: #e02020;
      --shadow: 0 8px 24px rgba(1, 46, 110, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(90deg, var(--paytm-navy-deep), var(--paytm-navy) 55%, #01408f);
      color: #fff;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(1, 46, 110, 0.28);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
    }
    .brand-copy strong {
      display: block;
      font-size: 20px;
      letter-spacing: -0.03em;
      color: #fff;
    }
    .brand-copy span {
      font-size: 12px;
      color: #9fdff8;
      font-weight: 500;
    }
    header .env-chip {
      background: rgba(0, 186, 242, 0.16);
      border: 1px solid rgba(0, 186, 242, 0.4);
      color: #c8f1ff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
    select, button, input {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-family: inherit;
    }
    button {
      background: var(--paytm-blue);
      color: var(--paytm-navy);
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 12px rgba(0, 186, 242, 0.35);
    }
    button:hover { background: var(--paytm-blue-dark); }
    button.ghost {
      background: #fff;
      color: var(--paytm-navy);
      border: 1px solid var(--line);
      box-shadow: none;
    }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .bar { height: 14px; background: #e6eef7; border-radius: 99px; overflow: hidden; }
    .bar > span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--ok), var(--paytm-blue), var(--warn), var(--hot));
    }
    h1 { font-size: 28px; margin: 0 0 8px; color: var(--paytm-navy); }
    h3 { margin: 0 0 8px; color: var(--paytm-navy); }
    .muted { color: var(--muted); }
    .nudge { border-left: 5px solid var(--warn); }
    .caveat { font-size: 13px; color: #3d5470; background: #fff; padding: 14px 16px; border-radius: 14px; border: 1px dashed var(--line); }
    a { color: #0179b5; font-weight: 600; }
    .kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 16px; }
    .kpi div {
      background: #f4f9fd;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid #dceaf5;
    }
    .kpi small { display: block; color: var(--muted); margin-bottom: 4px; font-weight: 500; }
    .kpi b { color: var(--paytm-navy); font-size: 18px; }
    footer {
      text-align: center;
      padding: 8px 0 28px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    @media (max-width: 600px) {
      header { padding: 14px 16px; display: block; }
      header .env-chip { margin-top: 10px; display: inline-block; }
      .wrap { padding: 16px; }
      .row { flex-direction: column; align-items: stretch; }
      select, button, input { width: 100%; min-height: 44px; }
      .kpi { grid-template-columns: 1fr 1fr; }
      .card { padding: 16px; border-radius: 16px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo-mark" src="/static/paytm-com-logo.png" alt="Paytm" />
      <div class="brand-copy">
        <strong>Paytm</strong>
        <span>GST Pulse · early visibility, not tax filing</span>
      </div>
    </div>
    <div class="env-chip" id="env"></div>
  </header>
  <div class="wrap">
    <div class="row">
      <select id="merchant"></select>
      <button onclick="ingest()">Run nightly ingest now</button>
      <button class="ghost" onclick="loadDash(true)">Refresh from mock Paytm</button>
    </div>
    <div class="card">
      <h1 id="title">Select a merchant</h1>
      <p class="muted" id="sub"></p>
      <div class="bar" title="GST registration threshold"><span id="fill" style="width:0%"></span></div>
      <p id="pctline"></p>
      <div class="kpi" id="kpis"></div>
    </div>
    <div class="card nudge" id="nudge" style="display:none"></div>
    <div class="card">
      <h3>Add other income (cash / other apps)</h3>
      <p class="muted">Optional and merchant-entered. GST looks at PAN-India aggregate, not just Paytm.</p>
      <div class="row">
        <input id="other" type="number" min="0" placeholder="Amount in ₹" />
        <button onclick="saveOther()">Save other income</button>
      </div>
    </div>
    <p class="caveat" id="caveat"></p>
    <footer>Secure payments · Paytm for Business</footer>
  </div>
  <script>
    const inr = n => "₹" + Number(n).toLocaleString("en-IN", {maximumFractionDigits: 0});
    async function boot() {
      const h = await fetch("/health").then(r => r.json());
      document.getElementById("env").textContent = h.env + " · " + h.paytm_base_url;
      const ms = await fetch("/v1/merchants").then(r => r.json());
      const sel = document.getElementById("merchant");
      sel.innerHTML = ms.map(m => `<option value="${m.merchant_id}">${m.name}</option>`).join("");
      sel.onchange = () => loadDash(false);
      await ingest();
      await loadDash(false);
    }
    async function ingest() {
      await fetch("/v1/ingest/run", {method: "POST"});
    }
    async function loadDash(refresh) {
      const id = document.getElementById("merchant").value;
      const d = await fetch(`/v1/merchants/${id}/dashboard?refresh=${refresh}`).then(r => r.json());
      document.getElementById("title").textContent = d.name;
      document.getElementById("sub").textContent =
        `${d.business_type} · ${d.state_code}${d.is_special_category ? " (special-category state)" : ""} · ${d.fy_label}`;
      document.getElementById("fill").style.width = Math.min(d.pct, 100) + "%";
      document.getElementById("pctline").innerHTML =
        `<b>${inr(d.aggregate_turnover)} of ${inr(d.threshold)}</b> — you are at <b>${d.pct}%</b>`;
      document.getElementById("kpis").innerHTML = `
        <div><small>Paytm (this FY)</small><b>${inr(d.paytm_turnover)}</b></div>
        <div><small>Other income (entered)</small><b>${inr(d.other_income)}</b></div>
        <div><small>Pace to limit</small><b>${d.months_to_threshold ?? "—"} months</b></div>
        <div><small>Composition eligible?</small><b>${d.composition_eligible ? "Yes" : "No"}</b></div>`;
      document.getElementById("other").value = d.other_income;
      document.getElementById("caveat").textContent = d.data_caveat;
      const n = document.getElementById("nudge");
      if (d.pct >= 60) {
        n.style.display = "block";
        n.innerHTML = `<h3>Early warning</h3>
          <p>At your current pace you may cross the GST registration limit in about
          <b>${d.months_to_threshold} months</b>. Registering does not always mean high tax —
          the Composition Scheme may keep this to a flat ${d.composition_rate_hint} with quarterly filing.</p>
          <p><a href="${d.advisor_url}" target="_blank">Ask GST Pulse (chat + voice)</a> ·
          <a href="${d.gst_portal}" target="_blank">Start GST registration</a></p>
          <p class="muted">Checklist: PAN, bank details, address proof, photograph, Aadhaar of authorised signatory.</p>`;
      } else n.style.display = "none";
    }
    async function saveOther() {
      const id = document.getElementById("merchant").value;
      const amount = Number(document.getElementById("other").value || 0);
      await fetch(`/v1/merchants/${id}/other-income`, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({amount})
      });
      await loadDash(false);
    }
    boot();
  </script>
</body>
</html>
