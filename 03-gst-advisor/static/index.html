<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paytm GST Pulse Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paytm-navy: #012e6e;
      --paytm-navy-deep: #001b4d;
      --paytm-blue: #00baf2;
      --paytm-blue-dark: #00a1d6;
      --bg: #eef3f9;
      --card: #ffffff;
      --line: #d7e3f0;
      --text: #1a2b45;
      --muted: #5b6f88;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    header {
      background: linear-gradient(90deg, var(--paytm-navy-deep), var(--paytm-navy) 55%, #01408f);
      color: #fff;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 16px rgba(1, 46, 110, 0.28);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 10px;
      object-fit: cover; display: block;
    }
    .brand-copy strong { display: block; font-size: 18px; letter-spacing: -0.03em; }
    .brand-copy span { font-size: 12px; color: #9fdff8; font-weight: 500; }
    header .muted { color: #c8f1ff; font-size: 12px; font-weight: 600; }
    .wrap {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #log { flex: 1; min-height: 48vh; }
    .msg {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 4px;
      padding: 12px 14px;
      margin: 10px 0;
      white-space: pre-wrap;
      max-width: 88%;
      box-shadow: 0 6px 16px rgba(1, 46, 110, 0.06);
    }
    .me {
      margin-left: auto;
      background: var(--paytm-blue);
      color: var(--paytm-navy);
      border-color: transparent;
      border-radius: 16px 16px 4px 16px;
      font-weight: 600;
    }
    .composer {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 10px;
      display: flex;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(1, 46, 110, 0.08);
    }
    input, select, button {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: #f7fbfe;
      color: var(--text);
      font-family: inherit;
    }
    button {
      background: var(--paytm-blue);
      color: var(--paytm-navy);
      font-weight: 700;
      cursor: pointer;
      border: none;
    }
    button.ghost {
      background: #e8f7fd;
      color: var(--paytm-navy);
    }
    .muted { color: var(--muted); font-size: 13px; }
    audio { width: 100%; margin-top: 8px; }
    @media (max-width: 600px) {
      header { padding: 14px 16px; display: block; }
      header .muted { margin-top: 6px; }
      .wrap { padding: 16px; }
      .composer { flex-direction: column; }
      .composer input, .composer select, .composer button { width: 100%; min-height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img class="logo-mark" src="/static/paytm-com-logo.png" alt="Paytm" />
      <div class="brand-copy">
        <strong>Paytm</strong>
        <span>GST Pulse · ask anything about registration</span>
      </div>
    </div>
    <div class="muted">Same facts as the WhatsApp alerts</div>
  </header>
  <div class="wrap">
    <p class="muted">Not a CA. Not the GST department. Voice needs a Sarvam API key.</p>
    <div id="log"></div>
    <div class="composer">
      <select id="lang">
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="te">తెలుగు</option>
      </select>
      <input id="q" style="flex:1" placeholder="What happens if I register for GST?" />
      <button onclick="ask()">Ask</button>
      <button class="ghost" onclick="rec()">Voice</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("lang")) document.getElementById("lang").value = params.get("lang");
    function add(text, me, audio) {
      const d = document.createElement("div");
      d.className = "msg" + (me ? " me" : "");
      d.textContent = text;
      if (audio) {
        const a = document.createElement("audio");
        a.controls = true;
        a.src = "data:audio/wav;base64," + audio;
        d.appendChild(a);
      }
      document.getElementById("log").appendChild(d);
    }
    async function ask() {
      const question = document.getElementById("q").value.trim();
      if (!question) return;
      add(question, true);
      document.getElementById("q").value = "";
      const r = await fetch("/v1/chat", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          question,
          language: document.getElementById("lang").value,
          speak: true,
          merchant_id: params.get("merchant")
        })
      }).then(x => x.json());
      add(r.answer, false, r.audio_b64);
    }
    let media, chunks;
    async function rec() {
      if (!media) {
        const stream = await navigator.mediaDevices.getUserMedia({audio:true});
        media = new MediaRecorder(stream);
        chunks = [];
        media.ondataavailable = e => chunks.push(e.data);
        media.onstop = async () => {
          const blob = new Blob(chunks, {type: media.mimeType || "audio/webm"});
          const fd = new FormData();
          fd.append("file", blob, "q.webm");
          fd.append("language", document.getElementById("lang").value);
          const r = await fetch("/v1/voice", {method:"POST", body: fd}).then(x => x.json());
          if (r.transcript) add(r.transcript, true);
          add(r.answer || r.error || "No answer", false, r.audio_b64);
          media = null;
        };
        media.start();
        alert("Listening — tap Voice again to stop.");
      } else {
        media.stop();
      }
    }
    document.getElementById("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
    add("Ask about thresholds, composition, documents, or what registering actually changes.", false);
  </script>
</body>
</html>
